version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lacesnheels-db
    environment:
      POSTGRES_DB: ${DB_NAME:-lacesnheels}
      POSTGRES_USER: ${DB_USER:-lacesnheels}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lacesnheels}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lacesnheels-network

  app:
    build: .
    container_name: lacesnheels-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-lacesnheels}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-lacesnheels}?sslmode=disable
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
      VITE_DATABASE_URL: postgresql://${DB_USER:-lacesnheels}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-lacesnheels}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-}
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - ./dist:/app/dist:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - lacesnheels-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lacesnheels-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ${SSL_CERT_PATH:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - lacesnheels-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  lacesnheels-network:
    driver: bridge
